name: CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  # No paths filter on pull requests, deliberately: this workflow emits the
  # required status check, and a PR that matched no path (a docs-only change)
  # would never report it and could never merge. Pushes to main stay
  # paths-gated.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      # 'true' on a pull request or a push to the default branch, the runs
      # whose coverage and test results go to Codecov.
      COVERAGE_LEG: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Install dependencies
        run: npm ci

      - name: Verify better-sqlite3 native build
        shell: bash
        run: |
          if ! node -e "require('better-sqlite3')" 2>/tmp/sqlite3-err.log; then
            echo "::error::better-sqlite3 failed to load. This usually means the prebuilt native binary did not resolve for this Node/OS combination."
            echo ""
            echo "Diagnostic info:"
            echo "  Node version: $(node --version)"
            echo "  npm version:  $(npm --version)"
            echo "  OS:           $(uname -a)"
            echo "  Arch:         $(uname -m)"
            echo ""
            echo "Error output:"
            cat /tmp/sqlite3-err.log
            echo ""
            echo "Troubleshooting: https://github.com/WiseLibs/better-sqlite3/blob/master/docs/troubleshooting.md"
            exit 1
          fi
          echo "better-sqlite3 loaded successfully."

      - name: Supply-chain audit (npm audit, high severity)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run test suite
        id: tests
        run: npm test -- --coverage.enabled=${{ env.COVERAGE_LEG == 'true' }} --reporter=default --reporter=junit --outputFile.junit=junit.xml

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Build distributable output
        run: npm run build

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-logs-${{ github.run_id }}
          path: |
            npm-debug.log*
            /tmp/sqlite3-err.log
            dist/**
          retention-days: 7
          if-no-files-found: ignore

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: verify
    if: ${{ !cancelled() && needs.verify.result != 'cancelled' && needs.verify.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/coverage-final.json

      - name: Upload test results to Codecov
        if: ${{ needs.verify.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  package-verify:
    name: Package verify (tarball contents + install resolves)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build distributable output
        run: npm run build

      - name: Inspect tarball via npm pack --dry-run
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          echo "Tarball manifest captured to pack.json"
          node -e "const p=require('./pack.json');console.log('Files in tarball:');for (const f of p[0].files){console.log('  '+f.path)}"

      - name: Assert no forbidden paths in tarball
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const pack = require('./pack.json');
          const files = pack[0].files.map(f => f.path);
          const forbiddenPrefixes = ['design/', 'SHIP_GATE', 'tests/', '.github/', 'site/', 'node_modules/'];
          const violations = [];
          for (const f of files) {
            for (const p of forbiddenPrefixes) {
              if (f.startsWith(p)) violations.push({ file: f, rule: p });
            }
          }
          if (violations.length) {
            console.error('::error::Forbidden files found in published tarball:');
            for (const v of violations) console.error(`  ${v.file} (matches ${v.rule})`);
            console.error('');
            console.error('The "files" field in package.json should restrict the tarball to shippable artifacts only.');
            process.exit(1);
          }
          console.log('Tarball contents clean: no forbidden paths present.');
          EOF

      - name: Assert required dist entry points are in tarball
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const pack = require('./pack.json');
          const files = new Set(pack[0].files.map(f => f.path));
          const required = ['dist/cli.js', 'dist/server.js', 'dist/index.js', 'dist/index.d.ts'];
          const missing = required.filter(r => !files.has(r));
          if (missing.length) {
            console.error('::error::Required entry points missing from tarball:');
            for (const m of missing) console.error(`  - ${m}`);
            console.error('');
            console.error('Check the build output in dist/ and the "files" field in package.json.');
            process.exit(1);
          }
          console.log('All required entry points present in tarball.');
          EOF

      - name: Verify install resolves cleanly (npm install --dry-run)
        shell: bash
        run: |
          set -euo pipefail
          FRESH_DIR="$(mktemp -d)"
          echo "Using fresh temp dir: $FRESH_DIR"
          PKG="$(npm pack --silent --pack-destination "$FRESH_DIR")"
          echo "Packed tarball: $FRESH_DIR/$PKG"
          cd "$FRESH_DIR"
          npm init -y >/dev/null
          npm install --dry-run "./$PKG"
          echo "Install resolution check passed."

      - name: Upload pack manifest on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-verify-logs-${{ github.run_id }}
          path: |
            pack.json
          retention-days: 7
          if-no-files-found: ignore
