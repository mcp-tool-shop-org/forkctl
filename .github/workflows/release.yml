name: Release

# Publishes @mcptoolshop/forkctl to npm via OIDC trusted publishing (no token)
# when a GitHub Release is published. The npm Trusted Publisher must be bound to
# THIS file name (release.yml); renaming it breaks the binding.
#
# Added 2026-10-15: 2.1.0 was the last version on npm, published by hand. 2.1.1
# was bumped and its CHANGELOG entry written, but the repo had no release path,
# so this file is that path. It fires on `release: published` (the org rule for
# release workflows), so it never runs on a push and does not count against the
# two-workflow cap.
#
# Standards compliance (org workflow standards, 0-3):
#   PIN_PER_STEP 2       actions and Node are pinned; npm >= 11.5 is installed
#                        in a sandbox (the version OIDC auth needs).
#   ANDON_AUTHORITY 2    the tag/version check, `npm ci` and `prepublishOnly`
#                        (npm run verify: typecheck, test, build) each stop the
#                        job before anything is published.
#   NAMED_COMPENSATORS 2 the table below, with an owner for each action.
#   DECOMPOSE_BY_SECRETS 2  publishing is its own file; CI stays in ci.yml.
#   UNCERTAINTY_GATED_HUMANS 2  a person publishes the GitHub Release; nothing
#                        here starts on its own.
#   EXTERNAL_VERIFIER    n/a: no specialized claims.
#
# Compensators (mandatory; the publish below is irreversible):
#
#   Action: npm publish --provenance --access public
#   Undo:   Within npm's ~72-hour window, and only if nothing depends on it yet:
#             npm unpublish @mcptoolshop/forkctl@<version>
#           Outside it, the realistic case, deprecate it:
#             npm deprecate @mcptoolshop/forkctl@<version> "<reason> -- use <next> instead"
#           Post-rollback state: the tarball persists and existing installs keep
#           resolving it; new installs show the deprecation and it stops being
#           offered as latest. Nothing undoes an install already made.
#           Owner: mcp-tool-shop (npm account holder and GitHub org owner).
#
#   Action: the GitHub Release itself (published by a person, before this runs)
#   Undo:   Keep the tag and Release (npm provenance is bound to that tag and
#           commit) and mark it instead:
#             gh release edit <tag> --notes "Superseded by vX.Y.Z -- do not use"
#           Delete it (gh release delete <tag> --yes, plus --cleanup-tag) only if
#           nothing was published against it.
#           Owner: mcp-tool-shop (GitHub org owner).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.1.1); its GitHub Release must already exist'
        required: true

permissions:
  contents: read
  id-token: write   # npm provenance and OIDC trusted-publishing auth

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false   # never cancel a publish mid-flight

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm >=11.5 in a sandbox for OIDC trusted-publishing auth
        run: |
          # Node 22 ships npm 10.9, which signs provenance but cannot negotiate
          # the OIDC auth path (the PUT returns a misleading 404). An in-place
          # `npm i -g npm@latest` races the bundled arborist and breaks, so
          # install it into a sandbox dir and shadow the system npm via PATH.
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@11.21.1
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: Verify the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: ${TAG} | package.json: ${PKG_VERSION}"
          if [ "${TAG#v}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci

      # `prepublishOnly` runs `npm run verify` (typecheck, test, build) first,
      # so a red verify stops the publish.
      - name: Publish to npm with provenance (OIDC trusted publisher, no token)
        run: npm publish --provenance --access public
